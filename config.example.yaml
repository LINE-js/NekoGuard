# 複製至 config.yaml 後設定；此範例不應存放真實權杖。
# NEKOGUARD_API_TOKEN 會優先於 api.token；空白權杖無法啟動。
api:
  # 僅本機回送位址可使用 ws，遠端必須使用 wss；路徑固定為 /api/ws。
  url: ws://127.0.0.1:3789/api/ws
  token: ''
detection:
  # 模型估計達到此百分比才通知管理員；範圍為 0 到 100。
  thresholdPercent: 70
  # 新成員大頭貼含皇冠的模型估計達到此百分比即通知管理員（名稱含管理員相關字詞亦會通知）；省略時為 70。
  crownThresholdPercent: 70
# 選填：後端只通知新成員加入（較新的 LINE.js 內建 chat:member-joined）時，
# NekoGuard 以此 TypeSafe 金鑰自行判斷大頭貼皇冠；NEKOGUARD_JEV_TOKEN 會優先於 jev.token。
jev:
  token: ''
  model: jev-1.13.0
# 選填:兩階段判斷。Jev 達門檻先回覆標注(不 @ 任何人),再由 Claude 分析發言意圖,判定為詐騙才 @ 所有管理員。
# NEKOGUARD_REVIEW_API_KEY 會優先於 review.apiKey;未設定金鑰時達門檻直接 @ 管理員。複判失敗時仍會 @ 管理員。
review:
  apiKey: ''
  model: claude-haiku-5-5
