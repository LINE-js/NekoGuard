# 複製至 config.yaml 後設定；此範例不應存放真實權杖。
# NEKOGUARD_API_TOKEN 會優先於 api.token；空白權杖無法啟動。
api:
  # 僅本機回送位址可使用 ws，遠端必須使用 wss；路徑固定為 /api/ws。
  url: ws://127.0.0.1:3789/api/ws
  token: ''
detection:
  # 詐騙文字達到此百分比才進入後續判斷／通知；範圍為 0 到 100。
  thresholdPercent: 70
  # 新成員大頭貼含皇冠的模型估計達到此百分比即通知管理員（名稱含管理員相關字詞亦會通知）；省略時為 70。
  crownThresholdPercent: 70
  # 選填：聊天訊息的 Jev 機率達此百分比時跳過意圖複判，直接 @ 所有管理員；不適用記事，不得低於 thresholdPercent。
  # directAlertPercent: 90
# 後端為較新的 LINE.js（內建 chat:member-joined、已移除 scam:check）時必填：
# NekoGuard 以此 TypeSafe 金鑰自行判斷訊息詐騙機率與大頭貼皇冠，未設定則不分析訊息。
# 補丁後端可省略（改用其 scam:check／avatar:check）。NEKOGUARD_JEV_TOKEN 會優先於 jev.token。
# 記事本判斷一定需要 NekoGuard 的 jev.token 與至少一把 review 金鑰，且後端支援 chat:note-posted。
jev:
  token: ''
  model: jev-1.13.0
# 意圖分析（選填，記事必填）：Jev 達門檻先回覆標注（不 @ 任何人），再分析發言意圖，判定為詐騙才 @ 所有管理員。
# provider 為主要供應者（openai 或 anthropic，省略為 openai）；另一個有金鑰時，只在主要失敗時作為備援。
# 環境變數 NEKOGUARD_OPENAI_API_KEY／NEKOGUARD_ANTHROPIC_API_KEY 優先於檔案內的 apiKey。
# 聊天：未設金鑰或主要＋備援都失敗時仍會 @ 管理員。記事：不貼原文；都失敗時只保留預警。
review:
  provider: openai
  # 選填：每次意圖分析請求的等待秒數（1–120，省略為 30）。主要供應者逾時才改問備援，調短可更快換手，但可能切掉較慢的有效回覆。
  # timeoutSeconds: 30
  openai:
    apiKey: ''
    model: gpt-6-luna
    # 選填：OpenAI reasoning.effort（none、minimal、low、medium、high、xhigh、max；可用值依模型而定）。
    # 省略時不送出、使用模型預設（gpt-6-luna 為 medium）。調低可縮短等待與費用，但判讀品質需自行驗證。
    # reasoningEffort: medium
    # 選填：OpenAI service_tier。fast（同 priority）生成最快約 2.5 倍、價格為 2 倍；省略時沿用 OpenAI 專案設定。
    # serviceTier: fast
  anthropic:
    apiKey: ''
    model: claude-haiku-5-5
